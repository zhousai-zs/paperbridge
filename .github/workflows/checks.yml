name: Program checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies (no inference models)
        run: python -m pip install -r requirements-test.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run unit and local API tests
        run: python -m pytest -q
      - name: Check packaged web assets
        run: python scripts/check_package.py
  browser:
    name: Offline workbench browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Exercise library, revision, export and responsive layout without models
        run: node scripts/check_workbench.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-checks
          path: .cache/ui-checks/*.png
          if-no-files-found: ignore
