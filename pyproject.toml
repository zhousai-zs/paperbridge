[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbridge"
version = "0.1.0"
description = "Local academic PDF to auditable, agent-readable Markdown"
requires-python = ">=3.12,<3.15"
dependencies = ["mineru==4.0.12", "pypdfium2==5.14.0"]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab>=4"]

[project.scripts]
paperbridge = "paperbridge.cli:main"

[tool.setuptools.packages.find]
include = ["paperbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
